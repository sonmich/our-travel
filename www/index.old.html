<style>
* {box-sizing: border-box;margin: 0;padding: 0;}
body {background: #0f172a;color: #ffffff;min-height: 100vh;padding: 30px;font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;}
.container {width: 100%;max-width: 1000px;margin: 0 auto;}
/* =========================일본 지도========================= */
.map-wrapper {position: relative;width: 100%;aspect-ratio: 16 / 9;border-radius: 16px;overflow: hidden;background: #1e293b;border: 3px solid #d97706;box-shadow: 0 20px 25px -5px rgba(0,0,0,.6);user-select: none;}
.map-image {position: absolute;inset: 0;width: 100%;height: 100%;object-fit: cover;display: block;z-index: 1;}
/* =========================마커========================= */
.spot {position: absolute;transform: translate(-50%, -50%);z-index: 10;cursor: pointer;touch-action: none;}
.dot {position: relative;width: 13px;height: 13px;border-radius: 50%;background: var(--spot-color);border: 2px solid #fff;box-shadow: 0 0 9px var(--spot-color);z-index: 3;transition: transform .15s ease;}
.spot:hover .dot {transform: scale(1.4);}
.pulse {position: absolute;left: 50%;top: 50%;width: 13px;height: 13px;transform: translate(-50%, -50%);border-radius: 50%;background: var(--spot-color);animation: blink 1.6s infinite ease-out;z-index: 2;pointer-events: none;}
@keyframes blink {0% {width: 13px;height: 13px;opacity: .95;}
100% {width: 42px;height: 42px;opacity: 0;}}
.custom-label {position: absolute;top: 19px;left: 50%;transform: translateX(-50%);white-space: nowrap;background: #fff;color: #1e1b4b;padding: 2px 7px;border-radius: 10px;border: 1.5px solid #1e1b4b;box-shadow: 1.5px 1.5px 0 #1e1b4b;font-size: 11px;font-weight: 800;pointer-events: none;}
/* =========================범례========================= */
.legend {margin-top: 15px;display: grid;grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));gap: 10px;padding: 15px;background: #1e293b;border: 1px solid #334155;border-radius: 12px;}
.legend-item {display: flex;align-items: center;gap: 8px;padding: 6px;border-radius: 8px;cursor: pointer;font-size: 13px;font-weight: 800;transition: background .15s;}
.legend-item:hover {background: #334155;}
.legend-color {width: 12px;height: 12px;flex: 0 0 auto;border-radius: 50%;background: var(--spot-color);border: 1px solid #fff;}
/* =========================도시 팝업========================= */
.modal-overlay {position: fixed;inset: 0;z-index: 1000;
display: flex;align-items: center;justify-content: center;
padding: 15px;
background: rgba(0,0,0,.72);backdrop-filter: blur(4px);
opacity: 0;visibility: hidden;transition:opacity .25s ease,visibility .25s ease;}
.modal-overlay.active {opacity: 1;visibility: visible;}
.modal-card {position: relative;width: 90%;max-width: 800px;
overflow: hidden;
background: #1e293b;border: 1px solid #475569;border-radius: 16px;
box-shadow: 0 25px 50px -12px rgba(0,0,0,.8);
transform: translateY(20px);transition: transform .25s ease;}
.modal-overlay.active .modal-card {transform: translateY(0);}
.modal-close {position: absolute;top: 12px;right: 12px;z-index: 30;
width: 34px;height: 34px;
border: none;border-radius: 50%;
background: rgba(0,0,0,.55);color: #fff;
font-size: 20px;cursor: pointer;
display: flex;align-items: center;justify-content: center;}
.modal-close:hover {background: rgba(0,0,0,.85);}
/* =========================미디어========================= */
.modal-media-container {position: relative;
width: 100%;height: 500px;
background: #000;
display: flex;align-items: center;justify-content: center;
overflow: hidden;}
.modal-img,.modal-video {width: 100%;height: 100%;object-fit: contain;display: block;}
.modal-img {cursor: zoom-in;}
.modal-video {cursor: pointer;}
/* =========================미디어 오류========================= */
.media-error {display: none;
width: 100%;padding: 30px;
color: #fff;text-align: center;line-height: 1.7;font-size: 14px;}
.media-error strong {display: block;color: #fbbf24;margin-bottom: 10px;}
#mediaErrorText {display: block;word-break: break-all;color: #cbd5e1;}
/* =========================슬라이드 버튼========================= */
.slide-btn {position: absolute;top: 50%;z-index: 20;
transform: translateY(-50%);
width: 44px;height: 44px;
border: none;border-radius: 50%;
background: rgba(0,0,0,.45);color: #fff;
font-size: 22px;cursor: pointer;
display: flex;align-items: center;justify-content: center;}
.slide-btn:hover {background: rgba(0,0,0,.8);}
.slide-btn.prev {left: 10px;}
.slide-btn.next {right: 10px;}
.slide-counter {position: absolute;right: 10px;bottom: 10px;z-index: 20;
padding: 4px 9px;
background: rgba(0,0,0,.65);border-radius: 12px;
font-size: 11px;}
/* =========================설명========================= */
.modal-content {padding: 20px;}
.modal-title {display: flex;align-items: center;gap: 8px;
margin-bottom: 8px;
font-size: 20px;font-weight: 700;}
.modal-title-dot {width: 10px;height: 10px;border-radius: 50%;display: inline-block;}
.modal-desc {margin-bottom: 16px;
color: #cbd5e1;
font-size: 14px;line-height: 1.6;}
.modal-tags {display: flex;flex-wrap: wrap;gap: 6px;}
.modal-tag {padding: 4px 10px;
background: #334155;border: 1px solid #475569;border-radius: 20px;
color: #94a3b8;font-size: 12px;}
/* =========================전체화면========================= */
.fullscreen-modal {position: fixed;inset: 0;z-index: 2000;
display: flex;align-items: center;justify-content: center;
padding: 20px;
background: rgba(0,0,0,.94);backdrop-filter: blur(8px);
opacity: 0;visibility: hidden;
transition:opacity .25s ease,visibility .25s ease;}
.fullscreen-modal.active {opacity: 1;visibility: visible;}
.fullscreen-content {max-width: 95vw;max-height: 95vh;
width: auto;height: auto;
object-fit: contain;
border-radius: 8px;
box-shadow: 0 0 30px rgba(0,0,0,.8);}
.fullscreen-close {position: absolute;top: 20px;right: 25px;z-index: 2010;
width: 44px;height: 44px;
border: none;border-radius: 50%;
background: rgba(255,255,255,.2);color: #fff;
font-size: 28px;cursor: pointer;}
/* =========================모바일========================= */
@media (max-width: 700px) {
body {padding: 10px;}
.map-wrapper {border-width: 2px;border-radius: 12px;}
.legend {grid-template-columns: repeat(2, 1fr);gap: 6px;padding: 10px;}
.legend-item {font-size: 12px;}
.modal-overlay {padding: 8px;}
.modal-card {width: 100%;border-radius: 12px;}
.modal-media-container {height: 350px;}

.modal-desc {font-size: 13px;}
.slide-btn {width: 38px;height: 38px;}
.fullscreen-content {max-width: 100vw;max-height: 90vh;}}
</style>

/* =========================변수========================= */
const wrapper = document.getElementById("mapWrapper");
const spots = document.querySelectorAll(".spot");
let activeSpot = null;
let isDragging = false;
let startX = 0;
let startY = 0;
let currentMediaList = [];
let currentSlideIndex = 0;

/* =========================이미지 프리로드(Preload) 최적화========================= */
const preloadedCache = new Set();
function preloadSingleImage(url) {
  const cleanUrl = normalizeMediaUrl(url);
  if (cleanUrl && !preloadedCache.has(cleanUrl)) {
    const img = new Image();
    img.src = cleanUrl;
    preloadedCache.add(cleanUrl);
  }
}

function preloadSpotMedia(mediaList) {
  if (!mediaList || mediaList.length === 0) return;
  mediaList.forEach(item => {
    if (item.type === 'img') {
      preloadSingleImage(item.url);
    }
  });
}

/* =========================URL 정리========================= */
function normalizeMediaUrl(url) {
  if (!url) return "";
  return String(url).replace(/\\/g, "").trim();
}

/* =========================마커 이벤트========================= */
spots.forEach(function(spot) {
  spot.addEventListener("mousedown", startDrag);
  spot.addEventListener("touchstart", startDrag, { passive: false });
});

function startDrag(e) {
  activeSpot = this;
  isDragging = false;
  const point = e.touches ? e.touches[0] : e;
  startX = point.clientX;
  startY = point.clientY;
  document.addEventListener("mousemove", drag);
  document.addEventListener("touchmove", drag, { passive: false });
  document.addEventListener("mouseup", stopDrag);
  document.addEventListener("touchend", stopDrag);
}

function drag(e) {
  if (!activeSpot) return;
  const point = e.touches ? e.touches[0] : e;
  const clientX = point.clientX;
  const clientY = point.clientY;
  if (Math.abs(clientX - startX) > 5 || Math.abs(clientY - startY) > 5) {
    isDragging = true;
  }
  if (e.type === "touchmove") { e.preventDefault(); }
  if (!isDragging) return;
  const rect = wrapper.getBoundingClientRect();
  let left = ((clientX - rect.left) / rect.width) * 100;
  let top = ((clientY - rect.top) / rect.height) * 100;
  left = Math.max(0, Math.min(100, left));
  top = Math.max(0, Math.min(100, top));
  activeSpot.style.left = left.toFixed(1) + "%";
  activeSpot.style.top = top.toFixed(1) + "%";
}

function stopDrag() {
  if (activeSpot && !isDragging) {
    const name = activeSpot.getAttribute("data-name");
    const color = activeSpot.style.getPropertyValue("--spot-color");
    openModal(name, color);
  }
  activeSpot = null;
  document.removeEventListener("mousemove", drag);
  document.removeEventListener("touchmove", drag);
  document.removeEventListener("mouseup", stopDrag);
  document.removeEventListener("touchend", stopDrag);
}

/* =========================모달 열기========================= */
function openModal(name, color) {
  const data = spotData[name];
  if (!data) { console.error("도시 데이터가 없습니다:", name); return; }
  
  currentMediaList = data.media || [];
  currentSlideIndex = 0;

  // 모달이 열릴 때 해당 도시의 모든 이미지 백그라운드 프리로드
  preloadSpotMedia(currentMediaList);

  document.getElementById("modalName").innerText = name;
  document.getElementById("modalDesc").innerText = data.desc;
  document.getElementById("modalDot").style.backgroundColor = color || "#2563eb";

  /* 태그 설정 */
  const tagsContainer = document.getElementById("modalTags");
  tagsContainer.innerHTML = "";
  data.tags.forEach(function(tag) {
    const span = document.createElement("span");
    span.className = "modal-tag";
    span.innerText = tag;
    tagsContainer.appendChild(span);
  });

  updateSlideDisplay();
  document.getElementById("spotModal").classList.add("active");
  document.body.style.overflow = "hidden";
}

/* =========================슬라이드 표시========================= */
function updateSlideDisplay() {
  const imgEl = document.getElementById("modalImg");
  const videoEl = document.getElementById("modalVideo");
  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");
  const counter = document.getElementById("slideCounter");
  const errorEl = document.getElementById("mediaError");
  const errorText = document.getElementById("mediaErrorText");

  /* 초기화 */
  videoEl.pause(); videoEl.removeAttribute("src"); videoEl.load();
  imgEl.removeAttribute("src");
  imgEl.style.display = "none"; videoEl.style.display = "none";
  errorEl.style.display = "none";

  if (currentMediaList.length === 0) {
    counter.style.display = "none"; prevBtn.style.display = "none"; nextBtn.style.display = "none";
    errorEl.style.display = "block"; errorText.innerText = "등록된 사진 또는 동영상이 없습니다.";
    return;
  }

  const currentItem = currentMediaList[currentSlideIndex];
  const mediaUrl = normalizeMediaUrl(currentItem.url);

  /* 동영상 */
  if (currentItem.type === "video") {
    videoEl.style.display = "block";
    videoEl.src = mediaUrl;
    videoEl.load();
    videoEl.play().catch(function() { console.log("자동 재생이 제한되었습니다."); });
    videoEl.onerror = function() {
      videoEl.style.display = "none";
      errorEl.style.display = "block";
      errorText.innerText = mediaUrl;
    };
  }
  /* 이미지 */
  else {
    imgEl.style.display = "block";
    imgEl.src = mediaUrl;
    imgEl.alt = "도시 이미지";
    imgEl.onload = function() { errorEl.style.display = "none"; };
    imgEl.onerror = function() {
      imgEl.style.display = "none";
      errorEl.style.display = "block";
      errorText.innerText = mediaUrl;
    };
  }

  /* 슬라이드 버튼 및 카운터 설정 */
  if (currentMediaList.length > 1) {
    prevBtn.style.display = "flex";
    nextBtn.style.display = "flex";
    counter.style.display = "block";
    counter.innerText = (currentSlideIndex + 1) + " / " + currentMediaList.length;
  } else {
    prevBtn.style.display = "none";
    nextBtn.style.display = "none";
    counter.style.display = "none";
  }
}

/* =========================슬라이드 이동========================= */
function changeSlide(direction) {
  if (currentMediaList.length <= 1) return;
  currentSlideIndex += direction;

  if (currentSlideIndex < 0) {
    currentSlideIndex = currentMediaList.length - 1;
  } else if (currentSlideIndex >= currentMediaList.length) {
    currentSlideIndex = 0;
  }

  updateSlideDisplay();
}

/* =========================범례 클릭 처리========================= */
function openModalByName(name) {
  const spotEl = document.querySelector('.spot[data-name="' + name + '"]');
  const color = spotEl ? spotEl.style.getPropertyValue("--spot-color") : "#2563eb";
  openModal(name, color);
}

/* =========================모달 닫기========================= */
function closeModal() {
  const videoEl = document.getElementById("modalVideo");
  if (videoEl) {
    videoEl.pause();
    videoEl.removeAttribute("src");
    videoEl.load();
  }
  document.getElementById("spotModal").classList.remove("active");
  document.body.style.overflow = "";
}

function closeModalOnOuterClick(e) {
  if (e.target.classList.contains("modal-overlay")) { closeModal(); }
}

/* =========================전체화면========================= */
function openFullscreenMedia() {
  if (currentMediaList.length === 0) return;
  const currentItem = currentMediaList[currentSlideIndex];
  const mediaUrl = normalizeMediaUrl(currentItem.url);
  const fsModal = document.getElementById("fullscreenModal");
  const fsImg = document.getElementById("fullscreenImg");
  const fsVideo = document.getElementById("fullscreenVideo");

  fsImg.style.display = "none";
  fsVideo.style.display = "none";

  if (currentItem.type === "video") {
    fsVideo.style.display = "block";
    fsVideo.src = mediaUrl;
    fsVideo.load();
    fsVideo.play().catch(function(){});
  } else {
    fsVideo.pause();
    fsImg.style.display = "block";
    fsImg.src = mediaUrl;
  }

  fsModal.classList.add("active");
}

function closeFullscreenMedia() {
  const fsModal = document.getElementById("fullscreenModal");
  const fsVideo = document.getElementById("fullscreenVideo");
  if (fsVideo) { fsVideo.pause(); fsVideo.removeAttribute("src"); fsVideo.load(); }
  fsModal.classList.remove("active");
}

function closeFullscreenMediaOnOuterClick(e) {
  if (e.target.classList.contains("fullscreen-modal")) { closeFullscreenMedia(); }
}

/* =========================키보드 네비게이션========================= */
document.addEventListener("keydown", function(e) {
  if (e.key === "Escape") {
    closeFullscreenMedia();
    closeModal();
  }
  if (e.key === "ArrowRight") {
    if (document.getElementById("spotModal").classList.contains("active")) { changeSlide(1); }
  }
  if (e.key === "ArrowLeft") {
    if (document.getElementById("spotModal").classList.contains("active")) { changeSlide(-1); }
  }
});

  message.style.fontSize = "16px";
  message.style.fontWeight = "700";

});
